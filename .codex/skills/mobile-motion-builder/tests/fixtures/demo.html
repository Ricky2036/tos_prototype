<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Motion capture fixture</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef1f7; font: 16px system-ui; }
      .card { width: 300px; height: 180px; padding: 24px; border-radius: 28px; background: #3f57dc; color: white;
        transition: transform 400ms cubic-bezier(.2,0,0,1), border-radius 400ms cubic-bezier(.2,0,0,1); }
      .card.open { transform: translateY(-120px) scale(1.08); border-radius: 12px; }
      button { color: inherit; background: rgb(255 255 255 / 16%); border: 0; border-radius: 999px; padding: 12px 18px; }
      @media (prefers-reduced-motion: reduce) { .card { transition-duration: 80ms; } }
    </style>
  </head>
  <body>
    <main class="card" data-testid="card">
      <h1>Motion fixture</h1>
      <button data-testid="trigger">Open</button>
    </main>
    <script>
      document.querySelector('[data-testid="trigger"]').addEventListener('click', () => {
        document.querySelector('[data-testid="card"]').classList.add('open');
      });
    </script>
  </body>
</html>
