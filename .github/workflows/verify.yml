name: Verify

# 分层触发（见 docs/tOS-pipeline-1.0.md §10.1）：
#   push 任意分支 → G3 单测构建 + G7 断言棘轮（含浏览器，约 2–3 min）
#   全量 e2e 不在这里跑：632s 串行，塞进每次 push 会被超时摘掉，那才是真正的纸面门禁。
on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04   # 钉死，避免镜像迁移把门禁变成随机变量
    # 硬超时：2026-11-12 实测过「unit tests 卡住 1h40m」——一个能挂死的门禁
    # 会把整条流水线堵住，比门禁本身失效更糟。宁可 15 分钟红，不要 6 小时挂着。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24   # 与本地一致；Node 20 上 unit tests 会挂死不退出
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 必须真装浏览器：S2 的 8 个运行时测试用 Vue+Vite 挂载组件，
      # 没有 chromium 时 before() 会抛错 —— 更糟的是 vueRuntime 起完 Vite
      # 再抛，server 不会 close，esbuild 子进程吊住，node --test 永不退出
      # （2026-11-12 实测：4 个 run 同时卡 in_progress 1h40m）。
      - name: Install chromium
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: G3 · unit tests
        timeout-minutes: 10
        # tap 落盘给 G7 复用：否则整套单测在 CI 里要跑两遍（含浏览器启动）
        shell: bash
        # pipefail：否则退出码是 tee 的，测试红了这一步也会绿
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/*.test.js | tee /tmp/tap.txt

      - name: G3 · production build
        run: npm run build

      - name: G7 · assert ratchet
        run: node scripts/check-assert-ratchet.mjs --tap /tmp/tap.txt --unit-only
