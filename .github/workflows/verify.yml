name: Verify

# 分层触发（见 docs/tOS-pipeline-1.0.md §10.1）：
#   push 任意分支 → G3 单测构建 + G7 断言棘轮（< 90s）
#   全量 e2e 不在这里跑：632s 串行，塞进每次 push 会被超时摘掉，那才是真正的纸面门禁。
on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04   # 钉死，避免镜像迁移把门禁变成随机变量
    # 硬超时：2026-11-12 实测过「unit tests 卡住 1h40m」——一个能挂死的门禁
    # 会把整条流水线堵住，比门禁本身失效更糟。宁可 15 分钟红，不要 6 小时挂着。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24   # 与本地一致；Node 20 上 unit tests 会挂死不退出
          cache: npm

      - name: Install dependencies
        env:
          # 与 deploy.yml 一致：本 job 不跑浏览器，省 40–60s
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: G3 · unit tests
        timeout-minutes: 10
        run: npm test

      - name: G3 · production build
        run: npm run build

      - name: G7 · assert ratchet
        run: node scripts/check-assert-ratchet.mjs
